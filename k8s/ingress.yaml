apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axion-ingress
  namespace: axion-testsop
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Path-based routing for the API
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
  - hosts:
    - axion-ui-testsop.online
    - axion-api-testsop.online
    secretName: axion-ui-testsop-tls
  rules:
  - host: axion-ui-testsop.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: axion-ui
            port:
              number: 80
  - host: axion-api-testsop.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: axion-telemetry-query-service
            port:
              number: 8000
