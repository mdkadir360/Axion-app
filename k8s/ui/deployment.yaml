apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion-testsop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
      - name: axion-ui
        image: mdkadir360/axion-ui:IMAGE_TAG
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: axion-ui
  namespace: axion-testsop
spec:
  selector:
    app: axion-ui
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
