apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion-minikube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
      - name: axion-ui
        image: mdkadir360/axion-ui:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: axion-ui
  namespace: axion-minikube
spec:
  selector:
    app: axion-ui
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
